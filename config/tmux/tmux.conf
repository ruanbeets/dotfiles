# Batcomputer tmux: truecolor, quiet status line, no automatic session launch.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',konsole-256color:RGB'
set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -g escape-time 10
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g allow-rename off
set -g set-clipboard on
set -g status-interval 10
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 70
set -g status-style "bg=#0F0716,fg=#C8C1CC"
set -g message-style "bg=#28083E,fg=#F8ED43,bold"
set -g message-command-style "bg=#28083E,fg=#F8ED43"
set -g pane-border-style "fg=#3B104F"
set -g pane-active-border-style "fg=#D72AC0"
set -g window-status-style "bg=#0F0716,fg=#807682"
set -g window-status-format " #I:#W#{?window_bell_flag, ,} "
set -g window-status-current-style "bg=#D72AC0,fg=#030405,bold"
set -g window-status-current-format " #I:#W "
set -g status-left " #[fg=#030405,bg=#F6E72B,bold]  #S #[fg=#D72AC0,bg=#0F0716]"
set -g status-right "#[fg=#6D115F]#[fg=#F8ED43,bg=#6D115F]  #{pane_current_path} #[fg=#D72AC0,bg=#6D115F]#[fg=#030405,bg=#D72AC0,bold] %H:%M "

# Familiar split bindings and pane movement without replacing prefix Ctrl+B.
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key C-s run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
bind-key C-r run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes ''
set -g @resurrect-save 'C-s'
set -g @resurrect-restore 'C-r'

run '~/.tmux/plugins/tpm/tpm'
