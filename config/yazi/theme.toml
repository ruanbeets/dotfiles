[mgr]
cwd = { fg = "#F8ED43", bold = true }
hovered = { fg = "#F8ED43", bg = "#3B104F", bold = true }
preview_hovered = { underline = true }
find_keyword = { fg = "#030405", bg = "#F6E72B", bold = true }
find_position = { fg = "#D72AC0", bg = "reset", bold = true }
marker_selected = { fg = "#030405", bg = "#F6E72B" }
marker_copied = { fg = "#030405", bg = "#8FCF9A" }
marker_cut = { fg = "#030405", bg = "#FF6670" }
tab_active = { fg = "#030405", bg = "#D72AC0", bold = true }
tab_inactive = { fg = "#C8C1CC", bg = "#28083E" }
border_symbol = "│"
border_style = { fg = "#6D115F" }

[status]
overall = { fg = "#E8E6EA", bg = "#0F0716" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#D72AC0" }
perm_read = { fg = "#8FCF9A" }
perm_write = { fg = "#F6E72B" }
perm_exec = { fg = "#FF6670" }
perm_sep = { fg = "#807682" }

[select]
border = { fg = "#D72AC0" }
active = { fg = "#F8ED43", bold = true }
inactive = { fg = "#807682" }

[input]
border = { fg = "#D72AC0" }
title = { fg = "#F8ED43" }
value = { fg = "#E8E6EA" }
selected = { reversed = true }

[tasks]
border = { fg = "#6D115F" }
title = { fg = "#F8ED43" }
hovered = { fg = "#D72AC0", underline = true }

[which]
cols = 3
mask = { bg = "#0F0716" }
cand = { fg = "#F8ED43" }
rest = { fg = "#807682" }
desc = { fg = "#D72AC0" }
separator = "  •  "
separator_style = { fg = "#6D115F" }

[help]
on = { fg = "#F8ED43" }
run = { fg = "#D72AC0" }
desc = { fg = "#807682" }
hovered = { fg = "#F8ED43", bg = "#3B104F", bold = true }
footer = { fg = "#E8E6EA", bg = "#0F0716" }

[filetype]
rules = [
  { mime = "image/*", fg = "#D72AC0" },
  { mime = "video/*", fg = "#A31593" },
  { mime = "audio/*", fg = "#A31593" },
  { mime = "application/zip", fg = "#F6E72B" },
  { mime = "application/x-tar", fg = "#F6E72B" },
  { url = "**/.git/", fg = "#D72AC0" },
  { url = "**/*.md", fg = "#F8ED43" },
  { url = "**/*.rs", fg = "#FF9D64" },
  { url = "**/*.py", fg = "#8FCF9A" },
  { url = "**/*.json", fg = "#F6E72B" },
  { url = "**/*.toml", fg = "#D72AC0" },
  { url = "**/*.yaml", fg = "#D72AC0" },
  { url = "**/*.yml", fg = "#D72AC0" },
  { url = "**/*.sh", fg = "#8FCF9A" },
  { url = "**/*.fish", fg = "#8FCF9A" },
  { url = "**/*.conf", fg = "#807682" },
  { url = "**/*.log", fg = "#807682" },
  { url = "**/*.txt", fg = "#C8C1CC" },
  { url = "**/*.pdf", fg = "#FF6670" },
  { url = "*/", fg = "#A31593" },
]

[icon]
prepend_conds = [
  { if = "dir", text = "󰉋", fg = "#D72AC0" },
]
